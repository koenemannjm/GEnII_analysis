# format is <var> <val>
# NOTE: MUST have a space between <var> and <val>

# kine info
config GEN4b
target He3
ebeam 8.448
sbs_config SBSOFF
pass pass3
hcal_angle 18.0
hcal_distance 17.0

# cut info
global_cut abs(bb.tr.vz[0])<0.27&&bb.sh.e>0&&bb.ps.e>0&&sbs.hcal.e>0&&abs(bb.ps.atimeblk-bb.sh.atimeblk)<10&&abs(sbs.hcal.atimeblk-bb.sh.atimeblk)<30&&abs(sbs.hcal.atimeblk-bb.ps.atimeblk)<30&&e.kine.W2<6.0
goode_cut bb.ps.e>0.2&&abs(bb.etot_over_p[0]-1.)<0.25&&abs(bb.ps.atimeblk-bb.hodotdc.clus.tfinal[0])<5&&abs(bb.sh.atimeblk-bb.hodotdc.clus.tfinal[0])<5&&e.kine.W2<2.0
sigma_dx 0.0
sigma_dy 0.0
goodn_cut abs(sbs.hcal.atimeblk-bb.sh.atimeblk)<5&&abs(sbs.hcal.atimeblk-bb.ps.atimeblk)<5&&abs(sbs.hcal.atimeblk-bb.hodotdc.clus.tfinal[0])<5&&sbs.hcal.e>0.02

#for trimming script
input_dir /volatile/halla/sbs/sbs-gen/GEN_REPLAYS/pass3/GEN4b/He3/SBSOFF/rootfiles/
output_dir /work/halla/sbs/koeneman/GEnII/outdir/data-rootfiles/pass3/
output_filename trimmed_GEN4b_He3_pass3_SBSOFF.root
